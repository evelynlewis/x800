[package]
name = "roger"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
honggfuzz = { version = "0.5", default-features = false }
x800 = { path = "..", optional = true, default-features = false }

[features]
default = ["sink"]
mini = ["x800/mini"]
sink = ["x800/sink"]

[lints.clippy]
all = "deny"
cargo = "deny"
pedantic = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "debuginfo"

[[bin]]
name = "roger"
path = "src/roger.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hroger"
path = "src/hroger.rs"
test = false
doc = false
bench = false

[lib]
name = "roger"
path = "src/shared.rs"
test = false
doc = false
bench = false
