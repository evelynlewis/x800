[package]
name = "x800"
version = "0.1.0"
authors = ["Evelyn Lewis <evelyn@evelynlewis.net>"]
edition = "2021"
description = "a fast and minimal 2048 for POSIX"
license = "MIT"
categories = ["command-line-utilities", "games", "embedded"]
repository = "https://github.com/evelynlewis/x800"
keywords = ["2048", "command-line", "game", "libc", "minimal", "embedded"]
readme = "README.md"

[lib]
name = "x800"
path = "src/lib.rs"

[[bin]]
name = "x800"
path = "src/bin.rs"

[dependencies]
fastrand = "2.0.1"
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
honggfuzz = { version = "0.5.55", default-features = false }
iai = { version = "0.1.1", default-features = false }
roger = { path = "fuzz" }

[lints.clippy]
all = "deny"
cargo = "deny"
pedantic = "deny"

[profile.release]
codegen-units = 1
debug-assertions = false
incremental = false
overflow-checks = false
opt-level = 3
lto = "fat"
panic = "abort"
strip = "symbols"

[[bench]]
name = "park"
harness = false

[[bench]]
name = "mark"
harness = false
