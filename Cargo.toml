[package]
name = "x800"
version = "0.1.0"
authors = ["Evelyn Lewis <evelyn@evelynlewis.net>"]
edition = "2021"
rust-version = "1.56"
description = "A fast and minimal 2048 for POSIX"
license = "MIT"
categories = ["command-line-utilities", "games", "embedded"]
repository = "https://github.com/evelynlewis/x800"
keywords = ["2048", "command-line", "game", "libc", "minimal", "embedded"]
readme = "README.md"

[[bin]]
name = "x800"
path = "src/bin.rs"

[[bin]]
name = "ryan"
path = "src/ryan/bin.rs"

[lib]
name = "x800"
path = "src/lib.rs"

[dependencies]
fastrand = "2.0.1"
libc = "0.2"

[lints.clippy]
all = "deny"
cargo = "deny"
pedantic = "deny"

[profile.release]
codegen-units = 1
debug-assertions = false
incremental = false
overflow-checks = false
opt-level = 3
lto = "fat"
panic = "abort"
strip = "symbols"

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
iai = { version = "0.1.1", default-features = false }
x800 = { path = ".", features = ["sink"] }

[features]
default = []
sink = []
mini = ["sink"]
save = []

[[bench]]
name = "timed"
harness = false
required-features = ["sink"]

[[bench]]
name = "count"
harness = false
required-features = ["sink"]
