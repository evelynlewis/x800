[package]
name = "x800"
version = "0.1.0"
authors = ["Evelyn Lewis <evelyn@evelynlewis.net>"]
edition = "2021"
rust-version = "1.80"
description = "A fast and minimal 2048 for POSIX"
license = "MIT"
categories = ["command-line-utilities", "games", "embedded"]
repository = "https://github.com/evelynlewis/x800"
keywords = ["2048", "command-line", "game", "libc", "minimal", "embedded"]
readme = "README.md"

[[bin]]
name = "x800"
path = "src/bin.rs"

[[bin]]
name = "ryan"
path = "src/ryan/bin.rs"

[[bin]]
name = "rmini"
path = "src/rmini/bin.rs"

[lib]
name = "x800"
path = "src/lib.rs"

[dependencies]
fastrand = "2.0.1"
libc = "0.2"
spin = { version = "0.10", default-features = false, features = ["use_ticket_mutex"] }

[lints.clippy]
all = "deny"
cargo = "deny"
pedantic = "deny"

[profile.release]
codegen-units = 1
debug-assertions = false
incremental = false
overflow-checks = false
opt-level = 3
lto = "fat"
panic = "abort"
strip = "symbols"

[profile.release-debuginfo]
inherits = "release"
debug = true
strip = "none"

[dev-dependencies]
divan = { version = "0.1.14", default-features = false }
x800 = { path = ".", features = ["sink"] }

[features]
interactive = []
default = ["interactive"]
sink = ["interactive"]
score = ["sink"]
save = []

[[bench]]
name = "timed"
harness = false
required-features = ["sink"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
