name: docs

on:
  push:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Setup github-pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Build documentation
        run: |
          cargo clean --doc
          cargo doc --no-deps --document-private-items
      - name: HTML redirect
        run: |
          echo '<meta http-equiv="refresh" content="0;url=x800/index.html">' > target/doc/index.html
      - name: Setup preview image
        run: |
          ls -d target/doc/x800/
          mkdir -p target/doc/x800/etc/
          cp -f etc/screen.png target/doc/x800/etc/
      - name: Remove doc lock
        run: rm target/doc/.lock
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
