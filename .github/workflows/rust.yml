name: x800

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: rustup toolchain install stable --profile minimal
      - name: Shell benchmark
        run: |
          echo "Running shell benchmark"
          ./util/bench.sh
      - name: Hyperfine benchmark
        run: |
          echo "Running hyperfine benchmark"
          ./util/hyperfine.sh
      - name: Criterion benchmarks
        run: |
          echo "Running criterion benchmarks"
          cargo bench --bench park > /dev/null
      - name: Iai benchmarks
        run: |
          echo "Running iai benchmarks"
          cargo bench --bench mark

  etc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt update
          sudo apt install -y valgrind
          rustup toolchain install stable --profile minimal
          rustup component add llvm-tools-preview
          cargo install --quiet cargo-fuzz
      - name: Validate
        run: |
          cargo fuzz run roger --sanitizer none --release -- -runs=0 > /dev/null
      - name: Coverage
        run: |
          ./util/coverage.sh
      - name: Profile
        run: |
          ./util/valgrind.sh
