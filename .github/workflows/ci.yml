name: build-bot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            ubuntu-24.04,
            ubuntu-22.04-arm,
            ubuntu-22.04,
            macos-latest,
            macos-15,
            macos-14,
            macos-13,
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          rustup toolchain install stable --profile minimal
      - name: Run tests
        run: |
          cargo clean --verbose
          cargo test --verbose
      - name: Build
        run: |
          cargo clean --verbose
          cargo build --verbose
      - name: ${{ matrix.os }} release build
        run: |
          cargo clean --verbose
          cargo build --verbose --release
      - name: ${{ matrix.os }} release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x800-${{ matrix.os }}
          path: |
            target/release/x800
            target/release/ryan

  portability:
    env:
      CROSS_VERSION: 0.2.5
    strategy:
      fail-fast: true
      matrix:
        target: [
            aarch64-unknown-linux-gnu,
            aarch64-unknown-linux-musl,
            arm-unknown-linux-gnueabi,
            arm-unknown-linux-gnueabihf,
            arm-unknown-linux-musleabi,
            arm-unknown-linux-musleabihf,
            armv5te-unknown-linux-gnueabi,
            armv5te-unknown-linux-musleabi,
            armv7-unknown-linux-gnueabi,
            armv7-unknown-linux-gnueabihf,
            armv7-unknown-linux-musleabi,
            armv7-unknown-linux-musleabihf,
            i586-unknown-linux-gnu,
            i586-unknown-linux-musl,
            #i686-unknown-freebsd, # Cross v0.2.5 is broken for i686-unknown-freebsd
            i686-unknown-linux-gnu,
            i686-unknown-linux-musl,
            #mips-unknown-linux-gnu, # rust-std is not available for mips-unknown-linux-gnu in Rust 1.79.0
            #mips-unknown-linux-musl, # rust-std is not available for mips-unknown-linux-musl in Rust 1.79.0
            #mips64-unknown-linux-gnuabi64, # rust-std is not available for mips64-unknown-linux-gnuabi64 in Rust 1.79.0
            #mips64-unknown-linux-muslabi64, # rust-std is not available for mips64-unknown-linux-muslabi64 in Rust 1.79.0
            #mips64el-unknown-linux-gnuabi64, # rust-std is not available for mips64el-unknown-linux-gnuabi64 in Rust 1.79.0
            #mips64el-unknown-linux-muslabi64, # rust-std is not available for mips64el-unknown-linux-muslabi64 in Rust 1.79.0
            #mipsel-unknown-linux-gnu, # rust-std is not available for mipsel-unknown-linux-gnu in Rust 1.79.0
            #mipsel-unknown-linux-musl,  # rust-std is not available for mipsel-unknown-linux-musl in Rust 1.79.0
            powerpc-unknown-linux-gnu,
            powerpc64-unknown-linux-gnu,
            powerpc64le-unknown-linux-gnu,
            riscv64gc-unknown-linux-gnu,
            s390x-unknown-linux-gnu,
            sparc64-unknown-linux-gnu,
            thumbv7neon-unknown-linux-gnueabihf,
            x86_64-unknown-linux-gnu,
            x86_64-unknown-linux-musl,
          ]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add llvm-tools-preview
          cargo install cross@${CROSS_VERSION}
      - name: Gold game end-to-end test
        run: sh -x ./util/gold.sh ${{ matrix.target }}
      - name: ${{ matrix.target }} release build
        run: |
          cargo clean --verbose
          cross build --release --verbose --target ${{ matrix.target }}
      - name: ${{ matrix.target }} release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x800-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/x800
            target/${{ matrix.target }}/release/ryan

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          rustup toolchain install stable --profile minimal
          cargo install hyperfine
      - name: ryan benchmarks
        run: |
          echo "Running ryan benchmarks"
          ./util/benchr.sh
      - name: Basic shell benchmark
        run: |
          echo "Running basic shell benchmark"
          ./util/benchs.sh
      - name: Mini shell benchmark
        run: |
          echo "Running mini shell benchmark"
          ./util/benchm.sh
      - name: Divan benchmarks
        run: |
          echo "Running Divan benchmarks"
          cargo bench --bench timed

  etc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt update
          sudo apt install -y valgrind
          rustup toolchain install stable --profile minimal
          rustup component add llvm-tools-preview
          cargo install cargo-fuzz
      - name: Validate
        run: |
          cargo clean --verbose
          cargo fuzz run roger --sanitizer none --release -- -runs=0
      - name: Coverage
        run: |
          ./util/cov.sh
      - name: Profile
        run: |
          ./util/valgrind.sh
